name: HappySpending
options:
  bundleIdPrefix: com.strawturtle
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  HappySpendingCore:
    path: Packages/HappySpendingCore
targets:
  HappySpending:
    type: application
    platform: iOS
    sources:
      - path: HappySpending
    dependencies:
      - package: HappySpendingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawturtle.happyspending
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Happy Spending
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        # 个人开发者账号(Bryan Wang (Personal Team))。团队 ID 本来就嵌在每个签过名的 app 里,不是秘密。
        DEVELOPMENT_TEAM: V39F967X54
